[package]
name = "ferro"
version = "0.1.0"
edition = "2021"
description = "A lightweight, native AI coding agent written in Rust"
license = "MIT"

[[bin]]
name = "ferro"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time", "signal", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
similar = "2"
ignore = "0.4"
globset = "0.4"
regex = "1"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"

# TLS：Windows / macOS 使用系统原生 TLS（零 C 依赖），Linux 使用 rustls
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
