<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="topBlade" x1="12%" y1="10%" x2="88%" y2="85%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#178563"/>
      <stop offset="100%" stop-color="#0E6249"/>
    </linearGradient>
    <linearGradient id="lowBlade" x1="15%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0D5C45"/>
    </linearGradient>
  </defs>
  <!-- 透明底极简几何符号：两道柔和圆润的翡翠绿折翼，暗含 Ferro 锋芒与 F 负空间 -->
  <!-- 主折翼（上横 + 左弧柱） -->
  <path d="M 118 228
           C 118 144, 178 96, 266 96
           L 382 96
           C 406 96, 418 124, 400 142
           L 354 188
           C 344 198, 330 204, 316 204
           L 254 204
           C 216 204, 198 222, 198 260
           L 198 378
           C 198 402, 170 416, 150 400
           L 128 380
           C 121 373, 118 363, 118 352
           Z"
        fill="url(#topBlade)"/>
  <!-- 次折翼（中短锋芒，留出优雅呼吸负空间） -->
  <path d="M 244 264
           L 352 264
           C 374 264, 386 290, 370 306
           L 332 344
           C 323 353, 310 358, 297 358
           L 244 358
           C 228 358, 218 346, 218 330
           L 218 290
           C 218 275, 229 264, 244 264
           Z"
        fill="url(#lowBlade)"/>
</svg>
